<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nur hell: Sonst färben Mailprogramme im Dunkelmodus Creme und Himbeere um -->
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Dein nomi-Code</title>
<!-- Apple Mail lädt die Schriften der App, Gmail und Outlook nehmen die Systemschrift -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
</head>
<body style="margin:0; padding:0; background:#F7F4EE;">
<!-- Vorschauzeile in der Postfachliste -->
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">Dein Code: {{ .Token }} · gilt eine Stunde.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F4EE;">
  <tr><td align="center" style="padding:36px 24px 40px 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;">
      <tr><td align="center">
        <img src="https://pohguhbhqvurdhnflpek.supabase.co/storage/v1/object/public/mail/chefi.png" width="120" alt="" style="display:block; border:0; height:auto;">
      </td></tr>
      <tr><td align="center" style="padding-top:14px;">
        <img src="https://pohguhbhqvurdhnflpek.supabase.co/storage/v1/object/public/mail/wordmark-on-light.png" width="96" alt="nomi" style="display:block; border:0; height:auto; font-family:Helvetica, Arial, sans-serif; font-size:28px; font-weight:bold; color:#CC335E;">
      </td></tr>
      <tr><td align="center" style="padding-top:26px; font-family:'Bricolage Grotesque', -apple-system, Helvetica, Arial, sans-serif; font-weight:800; font-size:28px; line-height:32px; color:#262B28;">
        Hallo! Hier ist dein Code.
      </td></tr>
      <tr><td align="center" style="padding-top:22px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="background:#CC335E; border-radius:999px; padding:14px 28px 14px 38px; font-family:'DM Mono', Menlo, Consolas, monospace; font-weight:500; font-size:36px; letter-spacing:10px; color:#FFFFFF;">{{ .Token }}</td>
        </tr></table>
      </td></tr>
      <tr><td align="center" style="padding-top:14px; font-family:'DM Mono', Menlo, Consolas, monospace; font-size:12px; letter-spacing:1.5px; color:#6E726F;">
        GILT 1 STUNDE
      </td></tr>
      <tr><td align="center" style="padding-top:26px; font-family:'DM Sans', -apple-system, Helvetica, Arial, sans-serif; font-size:16px; line-height:24px; color:#262B28;">
        Gib ihn in nomi ein, dann geht's los.
      </td></tr>
      <tr><td align="center" style="padding-top:30px; font-family:'DM Sans', -apple-system, Helvetica, Arial, sans-serif; font-size:13px; line-height:20px; color:#6E726F;">
        Du wolltest dich gar nicht anmelden?<br>Dann ignorier die Mail einfach.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
