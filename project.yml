name: NomNom
options:
  bundleIdPrefix: de.gregorzoller
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

targets:
  NomNom:
    type: application
    platform: iOS
    sources:
      - path: NomNom
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomnom
        PRODUCT_NAME: nomnom
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: nomnom
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: NomNom/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        UIAppFonts:
          - Fraunces-SemiBold.ttf
          - Fraunces-Bold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
        # Nur für `supabase start` auf 127.0.0.1 während der Entwicklung
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets:
        - NomNomTests
        - NomNomUITests

  NomNomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NomNomTests
    dependencies:
      - target: NomNom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomnom.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/nomnom.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/nomnom"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NomNomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NomNomUITests
    dependencies:
      - target: NomNom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomnom.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NomNom
        # XCTestCase-Overrides sind nonisolated; Testmethoden sind einzeln @MainActor
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
