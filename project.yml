name: NomNom
options:
  bundleIdPrefix: de.gregorzoller
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

targets:
  NomNom:
    type: application
    platform: iOS
    sources:
      - path: NomNom
    dependencies:
      - package: Supabase
        product: Supabase
      - target: NomNomShare
    entitlements:
      path: NomNom/NomNom.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.gregorzoller.nomnom.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomnom
        PRODUCT_NAME: nomnom
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: nomnom
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: NomNom/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        UIAppFonts:
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
        # Nur für `supabase start` auf 127.0.0.1 während der Entwicklung
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: nomnom fotografiert Rezepte aus Kochbüchern oder von Karteikarten, um sie auszulesen.
        # Gemeinsame Anmeldung mit der Teilen-Erweiterung (siehe SupabaseEnvironment.keychainGroup)
        KeychainAccessGroup: $(AppIdentifierPrefix)de.gregorzoller.nomnom.shared
    scheme:
      testTargets:
        - NomNomTests
        - NomNomUITests

  NomNomShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NomNomShare
      # Geteilter Code: Design-System, Modelle, Supabase-Zugang und Import
      - path: NomNom/DesignSystem
      - path: NomNom/Models
      - path: NomNom/Services
      - path: NomNom/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: NomNomShare/NomNomShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.gregorzoller.nomnom.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomnom.share
        PRODUCT_NAME: NomNomShare
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: NomNomShare/Info.plist
      properties:
        CFBundleDisplayName: nomnom
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)de.gregorzoller.nomnom.shared
        UIAppFonts:
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4

  NomNomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NomNomTests
    dependencies:
      - target: NomNom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomnom.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/nomnom.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/nomnom"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NomNomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NomNomUITests
    dependencies:
      - target: NomNom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomnom.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NomNom
        # XCTestCase-Overrides sind nonisolated; Testmethoden sind einzeln @MainActor
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
