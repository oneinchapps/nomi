name: Nomi
options:
  bundleIdPrefix: de.gregorzoller
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal Team (kostenloser Account) – Installation per Kabel, läuft 7 Tage
    DEVELOPMENT_TEAM: C4JPAJ4QQM

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

targets:
  Nomi:
    type: application
    platform: iOS
    sources:
      - path: Nomi
    dependencies:
      - package: Supabase
        product: Supabase
      - target: NomiShare
    entitlements:
      path: Nomi/Nomi.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.gregorzoller.nomi.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomi
        PRODUCT_NAME: nomi
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: nomi
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Nomi/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        # Startbildschirm in Himbeere, danach übernimmt der animierte SplashView mit Chefi
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
        # Nur für `supabase start` auf 127.0.0.1 während der Entwicklung
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: nomi fotografiert Rezepte aus Kochbüchern oder von Karteikarten, um sie auszulesen.
        NSMicrophoneUsageDescription: nomi hört zu, wenn du per Sprache mit nomi sprichst.
        NSSpeechRecognitionUsageDescription: Damit nomi versteht, was du sagst. Die Erkennung läuft wenn möglich direkt auf deinem iPhone.
        # Gemeinsame Anmeldung mit der Teilen-Erweiterung (siehe SupabaseEnvironment.keychainGroup)
        KeychainAccessGroup: $(AppIdentifierPrefix)de.gregorzoller.nomi.shared
    scheme:
      testTargets:
        - NomiTests
        - NomiUITests

  NomiShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NomiShare
      # Geteilter Code: Design-System, Modelle, Supabase-Zugang und Import
      - path: Nomi/DesignSystem
      - path: Nomi/Models
      - path: Nomi/Services
      - path: Nomi/Resources/Fonts
        buildPhase: resources
      # Wortmarke (Vektor-PDF) im Kopf der Teilen-Ansicht
      - path: Nomi/Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: NomiShare/NomiShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.gregorzoller.nomi.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomi.share
        PRODUCT_NAME: NomiShare
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: NomiShare/Info.plist
      properties:
        CFBundleDisplayName: nomi
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)de.gregorzoller.nomi.shared
        UIAppFonts:
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4

  NomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NomiTests
    dependencies:
      - target: Nomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/nomi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/nomi"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NomiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NomiUITests
    dependencies:
      - target: Nomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gregorzoller.nomi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Nomi
        # XCTestCase-Overrides sind nonisolated; Testmethoden sind einzeln @MainActor
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
